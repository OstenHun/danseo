name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    # Node 26 is a non-blocking preview, not a supported runtime declaration.
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Released security floors; resolve the newest patch within each supported major.
          node-version: ${{ matrix.node == '22' && '^22.23.4' || matrix.node == '24' && '^24.22.1' || matrix.node }}
          check-latest: true
          cache: npm
      - name: Report actual runtime
        run: node --version
      - run: npm ci
      - run: npm run check:docs
      - run: npm test
      - run: node dist/cli.js validate --workspace examples/minimal --json
      - run: npm run test:package

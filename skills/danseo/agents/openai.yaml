interface:
  display_name: "Danseo"
  short_description: "Map related research and trace claims to their sources"
  default_prompt: "Use $danseo to explore the paper, concept, topic, or field I name. Choose representative starting papers when I name no paper, then build the first interactive map with its main concepts, primary background readings, and checked paper relations. Ask for the subject if I haven't provided one."
